
name: Build JARVIS Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "pc_companion/**"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pc_companion/requirements.txt
          python -m pip install pyinstaller pytest httpx

      - name: Check Python source
        shell: pwsh
        run: |
          python -m py_compile pc_companion/jarvis_pc_server.py

      - name: Build Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name JARVIS-Professional --collect-all uvicorn --collect-all fastapi --collect-all pydantic --collect-all psutil --collect-all pycaw --collect-all comtypes --collect-all screen_brightness_control --collect-all pytesseract --collect-all PIL --collect-all pyautogui --collect-all pyperclip --hidden-import win32timezone --hidden-import uvicorn.logging --hidden-import uvicorn.loops --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols --hidden-import uvicorn.protocols.http --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets --hidden-import uvicorn.protocols.websockets.auto --paths pc_companion pc_companion/jarvis_pc_server.py

          if (!(Test-Path "dist/JARVIS-Professional.exe")) {
            throw "EXE was not produced"
          }

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/JARVIS-Professional.exe release/
          Copy-Item pc_companion/README.md release/PC-Companion-README.md
          Copy-Item pc_companion/OPTIPLEX_7060_PROFILE.md release/

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Professional-Windows-EXE
          path: release/*
          if-no-files-found: error
          retention-days: 14
