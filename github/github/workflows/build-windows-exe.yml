
name: Build JARVIS Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pc_companion/**"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify project files
        shell: pwsh
        run: |
          if (!(Test-Path "pc_companion/jarvis_pc_server.py")) {
            throw "Missing pc_companion/jarvis_pc_server.py"
          }
          if (!(Test-Path "pc_companion/requirements.txt")) {
            throw "Missing pc_companion/requirements.txt"
          }

      - name: Install dependencies
        working-directory: pc_companion
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        working-directory: pc_companion
        run: |
          pyinstaller --noconfirm --clean --onefile --name JARVIS-PC jarvis_pc_server.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-EXE
          path: pc_companion/dist/JARVIS-PC.exe
          if-no-files-found: error
